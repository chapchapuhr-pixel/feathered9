name: Android Build (APK & AAB)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug-apk
          - release-apk
          - release-aab
      version_name:
        description: 'Custom Version Name (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build:
    name: Build Android Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install NPM Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
      - name: 4. Build Production Web Application
        run: npm run build

      - name: 5. Synchronize Web Build with Android Wrapper
        run: npx cap sync android

      - name: 6. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: 7. Setup Android SDK & Accept Licenses
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH

          # Create licenses directory and pre-accept known Android SDK licenses
          mkdir -p "$ANDROID_ROOT/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n89377762e00b38b50773dd90ee64c199049482e6" > "$ANDROID_ROOT/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_ROOT/licenses/android-sdk-preview-license"
          echo -e "\n799f61101c38e057d973049a314e789e316f4480" > "$ANDROID_ROOT/licenses/android-sdk-arm-dbt-license"
          echo -e "\ne9acab5b5fbb560a72cfa4e6ce7b19f26344b10c" > "$ANDROID_ROOT/licenses/mips-android-sysimage-license"
          echo -e "\nbb33080f25bde990547a163e456411790047e359" > "$ANDROID_ROOT/licenses/google-gdk-license"
          echo -e "\n601085b94cd77f0b54ff86406955dce82e3770bc" > "$ANDROID_ROOT/licenses/android-googletv-license"

          # Use pre-installed sdkmanager with yes to accept any extra licenses
          if [ -x "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: 8. Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: 9. Determine Version Code & Name
        id: versioning
        run: |
          # Calculate unique auto-incrementing versionCode from GitHub run number
          BASE_VERSION_CODE=1000
          RUN_NUM=${{ github.run_number }}
          CALCULATED_VERSION_CODE=$((BASE_VERSION_CODE + RUN_NUM))
          
          CUSTOM_NAME="${{ github.event.inputs.version_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            VERSION_NAME="$CUSTOM_NAME"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="1.0.${RUN_NUM}"
          fi
          echo "VERSION_CODE=$CALCULATED_VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Using Version Code: $CALCULATED_VERSION_CODE, Version Name: $VERSION_NAME"
      - name: 10. Prepare Release Keystore (if provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret detected. Decoding to android/keystore.jks..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
            echo "KEYSTORE_FILE=$(pwd)/android/keystore.jks" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No signing keystore secret provided. Release builds will use fallback unsigned package."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi
      # -------------------------------------------------------------
      # BUILD DEBUG APK (Always generated for instant testing)
      # -------------------------------------------------------------
      - name: 11. Build Debug APK
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug-apk' || github.event.inputs.build_type == ''
        working-directory: ./android
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleDebug --stacktrace

      - name: 12. Upload Debug APK Artifact
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug-apk' || github.event.inputs.build_type == ''
        uses: actions/upload-artifact@v4
        with:
          name: UNERA-Debug-APK-v${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # -------------------------------------------------------------
      # BUILD RELEASE APK
      # -------------------------------------------------------------
      - name: 13. Build Release APK
        if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release-apk'
        working-directory: ./android
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 14. Upload Release APK Artifact
        if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release-apk'
        uses: actions/upload-artifact@v4
        with:
          name: UNERA-Release-APK-v${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # -------------------------------------------------------------
      # BUILD GOOGLE PLAY BUNDLE (AAB)
      # -------------------------------------------------------------
      - name: 15. Build Google Play Release AAB
        if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release-aab'
        working-directory: ./android
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: 16. Upload Google Play AAB Artifact
        if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release-aab'
        uses: actions/upload-artifact@v4
        with:
          name: UNERA-GooglePlay-AAB-v${{ env.VERSION_NAME }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
